<!doctype html><meta charset=utf-8>
<style>
html,body{margin:0;background:#070b2e;overflow:hidden}
canvas{display:block;width:100%;height:220px;touch-action:pan-y;user-select:none;cursor:pointer}
</style>
<canvas id=c></canvas>
<script>
const TW=window.TelegramWidget,cv=document.getElementById('c'),g=cv.getContext('2d');
let W,P,C,R,H=220,t=0,slide=0,sx=0,drag=null,cache={};
const KIT=[['#fff','#1d3fbf'],['#ffd21f','#1b8a3a'],['#e3262e','#fff'],['#222','#eee']];
const PAL={h:'#3b2314',s:'#f1c27d',w:'#fff',k:'#111'};
// 10x22 sprite frames: 0 stand, 1 kick, 2 arms up
const SPR=[
'...hhhh...|..hhhhhh..|..hsshsh..|..ssssss..|...ssss...|....ss....|..AAAAAA..|.AAAAAAAA.|sAAAAAAAAs|sAAAAAAAAs|.AAAAAAAA.|..AAAAAA..|..BBBBBB..|..BBBBBB..|..BB..BB..|..ss..ss..|..ss..ss..|..ww..ww..|..ww..ww..|..kk..kk..|.kkk..kkk.|..........',
'...hhhh...|..hhhhhh..|..hsshsh..|..ssssss..|...ssss...|....ss....|..AAAAAA..|.AAAAAAAA.|sAAAAAAAAs|.AAAAAAAA.|.sAAAAAAs.|..AAAAAA..|..BBBBBB..|..BBBBBB..|..BB..BBB.|..ss...sss|..ss....ww|..ww....kk|..ww....kk|..kk......|.kkk......|..........',
'.s..hhhh.s|.s.hhhhhh.|.s.hsshsh.|.A.ssssss.|.A..ssss.A|.A...ss..A|.AAAAAAAA.|.AAAAAAAA.|..AAAAAA..|..AAAAAA..|..AAAAAA..|..AAAAAA..|..BBBBBB..|..BBBBBB..|..BB..BB..|..ss..ss..|..ss..ss..|..ww..ww..|..ww..ww..|..kk..kk..|.kkk..kkk.|..........'];
// 5x7 bitmap font
const F={A:'.###.|#...#|#...#|#####|#...#|#...#|#...#',B:'####.|#...#|#...#|####.|#...#|#...#|####.',C:'.####|#....|#....|#....|#....|#....|.####',D:'####.|#...#|#...#|#...#|#...#|#...#|####.',E:'#####|#....|#....|####.|#....|#....|#####',G:'.####|#....|#....|#.###|#...#|#...#|.####',I:'#####|..#..|..#..|..#..|..#..|..#..|#####',L:'#....|#....|#....|#....|#....|#....|#####',M:'#...#|##.##|#.#.#|#.#.#|#...#|#...#|#...#',N:'#...#|##..#|#.#.#|#..##|#...#|#...#|#...#',O:'.###.|#...#|#...#|#...#|#...#|#...#|.###.',P:'####.|#...#|#...#|####.|#....|#....|#....',R:'####.|#...#|#...#|####.|#.#..|#..#.|#...#',S:'.####|#....|#....|.###.|....#|....#|####.',T:'#####|..#..|..#..|..#..|..#..|..#..|..#..',U:'#...#|#...#|#...#|#...#|#...#|#...#|.###.',W:'#...#|#...#|#...#|#.#.#|#.#.#|##.##|#...#',X:'#...#|#...#|.#.#.|..#..|.#.#.|#...#|#...#',Y:'#...#|#...#|.#.#.|..#..|..#..|..#..|..#..',
Г:'#####|#....|#....|#....|#....|#....|#....',И:'#...#|#...#|#..##|#.#.#|##..#|#...#|#...#',Ц:'#..#.|#..#.|#..#.|#..#.|#..#.|#####|....#',Я:'.####|#...#|#...#|.####|..#.#|.#..#|#...#',К:'#...#|#..#.|#.#..|##...|#.#..|#..#.|#...#',
'>':'#....|.#...|..#..|...#.|..#..|.#...|#....','<':'....#|...#.|..#..|.#...|..#..|...#.|....#','*':'.....|#...#|.#.#.|..#..|.#.#.|#...#|.....','.':'.....|.....|.....|.....|.....|.....|..#..'};
const ALIAS={Р:'P',Е:'E',С:'C',Т:'T',А:'A',О:'O',K:'К'};

function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function px(c,rows,col,sc,ox,oy){const x=c.getContext('2d');rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.')continue;x.fillStyle=col(ch);x.fillRect(ox+i*sc,oy+y*sc,sc,sc)}})}
function sprite(f,k,flip){const key='s'+f+k+flip;if(cache[key])return cache[key];let rows=SPR[f].split('|');if(flip)rows=rows.map(r=>[...r].reverse().join(''));const c=cvs(10,22);px(c,rows,ch=>ch==='A'?KIT[k][0]:ch==='B'?KIT[k][1]:PAL[ch],1,0,0);return cache[key]=c}
function text(s,col,sc){const key='t'+s+col+sc;if(cache[key])return cache[key];const c=cvs(s.length*6*sc,7*sc);[...s].forEach((ch,i)=>{const gl=F[ALIAS[ch]||ch];if(gl)px(c,gl.split('|'),()=>col,sc,i*6*sc,0)});return cache[key]=c}
function tx(s,x,y,col,sc,shadow){sc=sc||1;const c=text(s,col,sc);if(x==null)x=(C-c.width)>>1;if(shadow){g.drawImage(text(s,shadow,sc),x+sc,y+sc)}g.drawImage(c,x,y);return c.width}
function hex(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
const SKY=[[0,'#070b2e'],[.3,'#231452'],[.55,'#7a1a5a'],[.75,'#d8322f'],[.9,'#ff7a1f'],[1,'#ffb04a']].map(([p,c])=>[p,hex(c)]);
function band(y,gy){const p=y/gy;let i=1;while(SKY[i][0]<p)i++;const [p0,a]=SKY[i-1],[p1,b]=SKY[i],k=(p-p0)/(p1-p0);return'rgb('+a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join()+')'}
let snow=[];
function size(){W=cv.offsetWidth||360;P=2;C=Math.ceil(W/P);R=Math.ceil(H/P);const d=Math.min(2,devicePixelRatio||1);cv.width=C*P*d;cv.height=R*P*d;g.setTransform(P*d,0,0,P*d,0,0);g.imageSmoothingEnabled=false;snow=[];for(let i=0;i<40;i++)snow.push([Math.random()*C,Math.random()*R,.4+Math.random()*.8]);sx=-slide*C}

function player(x,y,k,sc,flip,ph){ // juggling player + ball
  const b=Math.abs(Math.sin(t*.25+ph)),f=b<.25?1:b>.8?2:0;
  g.drawImage(sprite(f,k,flip),x,y+(f==2?-1:0),10*sc,22*sc);
  const bx=flip?x-4*sc:x+10*sc+sc,by=y+22*sc-3*sc-b*12*sc;
  g.fillStyle='#fff';g.fillRect(bx,by,3*sc,3*sc);g.fillStyle='#111';g.fillRect(bx+sc,by+sc,sc,sc);g.fillRect(bx,by,sc,sc);g.fillRect(bx+2*sc,by+2*sc,sc,sc)
}
function lineup(gy){const n=Math.max(4,C/24|0),st=C/n;for(let i=0;i<n;i++){const f=((t>>3)+i)&1?2:0;g.drawImage(sprite(f,i%4,i%2),st*i+st/2-5|0,R-24-(f==2?1:0))}}
function plate(x,y,w,h){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x,y,w,h);g.fillStyle='#fff';g.fillRect(x,y,w,1);g.fillRect(x,y+h-1,w,1);g.fillRect(x,y,1,h);g.fillRect(x+w-1,y,1,h)}
function dots(x,y,a){g.fillStyle='#fff';g.fillRect(x,y,3,3);g.fillRect(x+6,y,3,3);g.fillStyle=a?'#070b2e':'#ffd21f';g.fillRect(x+(a?1:7),y+1,1,1)}

function slide1(gy){
  tx('WINTER CUP',null,8,'#bfe9ff',2,'#1a1a40');
  tx('DECEMBER',null,26,'#ffd21f',1,'#5a2a00');
  const y=gy+4-44;player(C*.2-10|0,y,0,2,0,0);player(C*.8-10|0,y,1,2,1,1.7);
  lineup(gy);
  const bl=(t>>2)&1,w=58,x=C-w-3,y2=R-38;plate(x,y2,w,11);dots(x+3,y2+4,0);tx("SWIPE",x+16,y2+2,"#fff",1);if(bl)tx(">",x+49,y2+2,"#ffd21f",1)
}
function slide2(gy){
  const w=17*6+9,x=(C-w)>>1,on=(t>>3)&1;g.fillStyle=on?'#ffd21f':'#ffb000';g.fillRect(x,8,w,13);g.fillStyle='#1a1a1a';g.fillRect(x+1,9,w-2,11);g.fillStyle=on?'#ffd21f':'#ffb000';g.fillRect(x+2,10,w-4,9);
  tx('РЕГИСТРАЦИЯ СКОРО',null,11,'#1a1a1a',1);
  tx('GRAND LEAGUE',null,30,'#fff',2,'#1a1a40');
  tx('*',null,47,'#ffd21f',1);
  tx('NO LOYALTY',null,55,'#fff',2,'#1a1a40');
  lineup(gy);
  const bl=(t>>2)&1,w2=54,x2=3,y2=R-38;plate(x2,y2,w2,11);if(bl)tx("<",x2+3,y2+2,"#ffd21f",1);tx("BACK",x2+11,y2+2,"#fff",1);dots(x2+41,y2+4,1)
}
function render(){
  const gy=R-40;
  for(let y=0;y<gy;y+=2){g.fillStyle=band(y,gy);g.fillRect(0,y,C,2)}
  for(let x=0;x<C;x+=16){g.fillStyle=(x>>4)&1?'#2f8f55':'#27804a';g.fillRect(x,gy,16,R-gy)}
  g.fillStyle='#e8f6ff';g.fillRect(0,gy,C,1);
  g.fillStyle='rgba(255,255,255,.85)';snow.forEach(s=>{g.fillRect(s[0]|0,s[1]|0,1,1)});
  g.save();g.translate(Math.round(sx),0);slide1(gy);g.translate(C,0);slide2(gy);g.restore()
}
function tick(){t++;snow.forEach(s=>{s[1]+=s[2];s[0]+=Math.sin((t+s[1])*.1)*.3;if(s[1]>R){s[1]=0;s[0]=Math.random()*C}});if(!drag){const tg=-slide*C;sx+=(tg-sx)*.35;if(Math.abs(tg-sx)<.5)sx=tg}render()}
cv.addEventListener('pointerdown',e=>{drag={x0:e.clientX,s0:sx};cv.setPointerCapture(e.pointerId);e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!drag)return;sx=Math.max(-C,Math.min(0,drag.s0+(e.clientX-drag.x0)/P));render()});
cv.addEventListener('pointerup',e=>{if(!drag)return;const d=(e.clientX-drag.x0)/P;if(Math.abs(d)<3)slide^=1;else if(d<-C/6)slide=1;else if(d>C/6)slide=0;drag=null;TW&&TW.HapticFeedback&&TW.HapticFeedback.selectionChanged()});
cv.addEventListener('pointercancel',()=>{drag=null});
try{slide=location.hash=="#2"?1:0}catch(e){}
size();new ResizeObserver(size).observe(cv);
let last=0;function loop(ts){if(ts-last>=80){last=ts;tick()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
TW&&TW.ready&&TW.ready();
</script>
