<!doctype html><meta charset=utf-8>
<title>Widget preview</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d7b4e8,#f1b7d2);font-family:system-ui}
.bubble{width:360px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cap{padding:8px 12px;font-size:14px}
iframe{display:block;width:360px;height:220px;border:0}
</style>
<div class=bubble id=b><div class=cap>❄️ <b>Winter Cup</b> — турнир FC Mobile в декабре.<br>Свайпни виджет вбок, чтобы узнать больше.</div></div>
<script>
// ?s=2 открывает второй слайд (виджет читает location.hash только для локального превью)
const f=document.createElement('iframe');f.src='winter_cup.html'+(location.search.includes('s=2')?'#2':'');document.getElementById('b').prepend(f);
</script>
